note: >-
  Cleveland-Cliffs has no REST/HTTP API and therefore no HTTP request/response conventions to
  capture. Its documented machine-to-machine surface is batch EDI: ANSI ASC X12 version 4010
  over SFTP (preferred) or a third-party VAN, with the company's own implementation guidelines
  published as 23 public PDFs plus a testing template. This file records the conventions of that
  surface, so the profile carries the real integration semantics rather than an empty HTTP shape.
surface: edi-batch
transport:
  primary: SFTP
  alternative: third-party value-added network (VAN)
  provider: IBM Sterling Supply Chain Business Network Hub - Cloud Services
  note: All EDI translation and communication utilizes the IBM network.
  source: https://www.clevelandcliffs.com/doing-business/for-outside-processors
authentication:
  style: out-of-band
  detail: >-
    SFTP credentials and trading-partner identifiers exchanged bilaterally during onboarding.
    No public self-service credential issuance. See authentication/cleveland-cliffs-authentication.yml.
versioning:
  scheme: standard-release
  current: ANSI ASC X12 version 4010
  applies_to: [Burns Harbor, Cleveland, Indiana Harbor, Kote]
  source: https://www.clevelandcliffs.com/doing-business/for-outside-processors
pagination:
  applicable: false
  reason: batch interchange, not a paged HTTP collection
error_envelope:
  style: x12-acknowledgement
  detail: >-
    The published guideline set does not include a 997 Functional Acknowledgement guideline, and
    Cleveland-Cliffs does not publish an error-code reference. 870-12 (order status hold/release
    acknowledgement) and 867-3 (product transfer reapplication acknowledgement) are the only
    acknowledgement transactions in the published catalog. Recorded as documented-partially.
  documented: partial
rate_limit_signaling:
  applicable: false
  reason: no synchronous request surface; see rate-limits/cleveland-cliffs-rate-limits.yml
idempotency:
  coverage: none
  supported: false
  mechanism: null
  detail: >-
    No idempotency key, replay-protection header, or duplicate-interchange policy appears in the
    published EDI specifications or on any Cleveland-Cliffs integration page. X12 interchange
    control numbers (ISA13/GS06/ST02) exist at the envelope level in every X12 implementation,
    but Cleveland-Cliffs publishes no statement about how duplicates are detected or rejected, so
    no replay guarantee can be claimed on their behalf.
  scope: []
reversibility:
  grade: documented
  detail: >-
    The published transaction catalog includes real correction and reversal transactions, but the
    guidelines are per-transaction implementation specs and no page states a time window inside
    which a correction is accepted. A reversal path exists; a stated window does not, so this
    grades `documented` rather than `verified`.
  operations:
