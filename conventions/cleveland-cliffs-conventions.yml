      reversal: 870-10 Inventory maintenance/correction
      window: null
      docs: https://www.clevelandcliffs.com/doing-business/for-outside-processors
    - write_surface: product transfer (867-1 / 867-2 Product transfer)
      reversal: 867-2 Product transfer (reapplication)
      acknowledgement: 867-3 Product transfer (reapplication acknowledgement)
      window: null
      docs: https://www.clevelandcliffs.com/doing-business/for-outside-processors
    - write_surface: receipt (861 Receipt advice)
      reversal: 861-3 Receipt advice (returned material)
      window: null
      docs: https://www.clevelandcliffs.com/doing-business/for-outside-processors
    - write_surface: order status
      reversal: 870-2 Order status (hold/release)
      acknowledgement: 870-12 Order status (hold/release acknowledgement)
      window: null
      docs: https://www.clevelandcliffs.com/doing-business/for-outside-processors
