description: >-
  Cleveland-Cliffs is North America's largest flat-rolled steel producer and
  supplier of iron ore pellets, operating an integrated business spanning
  mining, steelmaking, and downstream finishing for the automotive,
  infrastructure, and manufacturing markets. Cleveland-Cliffs does not
  publish a public developer portal, an OpenAPI/GraphQL contract, or any
  general-purpose REST API. Its documented machine-to-machine surface is batch
  EDI: ANSI ASC X12 version 4010 over SFTP or an IBM Sterling VAN, with 23
  implementation guidelines and an X12 testing template published as public
  downloads for outside processors at Burns Harbor, Cleveland, Indiana Harbor
  and Kote. Its transactional applications (Outside Processors Portal,
  iSupplier, Customer Service Center, Vendor Inquiry) are login-gated, and the
  only machine-readable discovery documents it serves are OIDC and RFC 8414
  metadata on its own Okta tenant at login.clevelandcliffs.com plus an RFC 9116
  security.txt.
