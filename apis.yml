        type: Sandbox
      - url: https://op.cliffssteel.com
        type: Portal
    description: >-
      Batch EDI trading-partner interface for outside processors at Burns Harbor, Cleveland,
      Indiana Harbor and Kote, compliant with ANSI ASC X12 version 4010 over SFTP or an IBM
      Sterling VAN. Cleveland-Cliffs publishes 23 implementation guidelines (810, 846, 856,
      861, 863, 867 and 870 transaction sets) and an X12 transaction testing template as public
      downloads; the Outside Processors Portal itself requires sign-in. This is the company's
      only documented machine-to-machine interface - there is no HTTP API.
